name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        # The frontend talks to the Convex backend through VITE_CONVEX_URL.
        # This is a public Convex deployment URL (not a secret), so it is
        # inlined here rather than read from a GitHub secret.
        env:
          GH_PAGES: "true"
          VITE_CONVEX_URL: "https://giddy-labrador-537.convex.cloud"
        run: bun run build

      - name: SPA fallback (404.html trick)
        # GitHub Pages serves 404.html for unknown paths, so client-side
        # routes like /auth and /dashboard load the app shell.
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
